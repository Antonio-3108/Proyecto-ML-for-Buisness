# Data Catalog: https://docs.kedro.org/en/stable/catalog-data/introduction/
#
# Raw data: IBM Telco Customer Churn (Kaggle, aadityabansalcodes).
# https://www.kaggle.com/datasets/aadityabansalcodes/telecommunications-industry-customer-churn-dataset
# The split tables share the key `Customer ID` (population joins on `Zip Code`).

raw_demographics:
  type: pandas.CSVDataset
  filepath: data/01_raw/Telco_customer_churn_demographics.csv

raw_location:
  type: pandas.CSVDataset
  filepath: data/01_raw/Telco_customer_churn_location.csv

raw_population:
  type: pandas.CSVDataset
  filepath: data/01_raw/Telco_customer_churn_population.csv

raw_services:
  type: pandas.CSVDataset
  filepath: data/01_raw/Telco_customer_churn_services.csv

raw_status:
  type: pandas.CSVDataset
  filepath: data/01_raw/Telco_customer_churn_status.csv

# Consolidated versions of the same customers (kept for reference / cross-checks)
raw_telco_churn:
  type: pandas.CSVDataset
  filepath: data/01_raw/Telco_customer_churn.csv

raw_customer_churn:
  type: pandas.CSVDataset
  filepath: data/01_raw/CustomerChurn.csv

# --- Intermediate: tablas unidas (pipeline data_processing) ---------------------

clientes_unidos:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/clientes_unidos.parquet

# --- Primary: tabla limpia, una fila por cliente ---------------------------------

clientes_limpios:
  type: pandas.ParquetDataset
  filepath: data/03_primary/clientes_limpios.parquet

# --- Feature: variables para el modelo (pipeline feature_engineering) ------------

features_clientes:
  type: pandas.ParquetDataset
  filepath: data/04_feature/features_clientes.parquet

# --- Model input: división train/test (pipeline model_training) -----------------

X_train:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/X_train.parquet
  save_args:
    index: true

X_test:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/X_test.parquet
  save_args:
    index: true

y_train:
  type: pickle.PickleDataset
  filepath: data/05_model_input/y_train.pkl

y_test:
  type: pickle.PickleDataset
  filepath: data/05_model_input/y_test.pkl

# --- Models ----------------------------------------------------------------------

modelo_regresion_logistica:
  type: pickle.PickleDataset
  filepath: data/06_models/modelo_regresion_logistica.pkl

# --- Reporting: evaluación (pipeline model_evaluation) ---------------------------

comparacion_modelos:
  type: pandas.CSVDataset
  filepath: data/08_reporting/comparacion_modelos.csv
  save_args:
    index: false
